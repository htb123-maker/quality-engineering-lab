version: 1
name: week25-isolated-smoke
base_url: http://127.0.0.1:28000
workspace: atlas
stages:
  - users: 4
    spawn_rate: 2
    duration_seconds: 10
thresholds:
  - name: smoke p95 latency
    metric: p95_response_time_ms
    operator: lte
    threshold: 1000
  - name: smoke error rate
    metric: error_rate
    operator: lte
    threshold: 0.01
  - name: smoke request evidence
    metric: total_requests
    operator: gte
    threshold: 20
