version: 1
name: week26-baseline
base_url: http://127.0.0.1:28000
workspace: qa-perf-week26-local
authentication: password
account_pool_size: 16
token_refresh_after_seconds: 20
stages:
  - users: 4
    spawn_rate: 2
    duration_seconds: 60
thresholds:
  - name: baseline p50 latency
    metric: p50_response_time_ms
    operator: lte
    threshold: 250
  - name: baseline p95 latency
    metric: p95_response_time_ms
    operator: lte
    threshold: 500
  - name: baseline error rate
    metric: error_rate
    operator: lte
    threshold: 0.01
  - name: baseline request evidence
    metric: total_requests
    operator: gte
    threshold: 200
  - name: baseline throughput
    metric: requests_per_second
    operator: gte
    threshold: 3
