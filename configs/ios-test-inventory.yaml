      - Resolve both notification controls
    expected_result: Both controls are displayed and enabled.

  - <<: *fixture_defaults
    id: IOS-INTERACTION-012
    node_id: tests/ios/test_week21_fixture_interactions.py::test_repeated_file_write_remains_idempotent
    area: system_interaction
    priority: P1
    business_intent: Verify repeated identical file writes leave readable content.
    steps:
      - Write the file twice
      - Read the file
    expected_result: The file is readable and contains the known payload.

  - <<: *fixture_defaults
