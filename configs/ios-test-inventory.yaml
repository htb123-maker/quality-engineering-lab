    expected_result: The status is exactly file idle.

  - <<: *fixture_defaults
    id: IOS-UI-008
    node_id: tests/ios/test_week21_fixture_ui.py::test_background_status_starts_with_launch_count
    area: system_interaction
    priority: P2
