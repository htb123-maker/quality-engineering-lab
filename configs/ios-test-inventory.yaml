    expected_result: The status starts with background launches.

  - <<: *fixture_defaults
    id: IOS-UI-009
    node_id: tests/ios/test_week21_fixture_ui.py::test_webview_title_is_visible
    area: webview
    priority: P1
    business_intent: Verify the native WebView section has a visible heading.
    steps:
