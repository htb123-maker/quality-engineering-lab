version: 1
name: week26-distributed-smoke
base_url: http://127.0.0.1:28000
workspace: qa-perf-week26-local
authentication: password
account_pool_size: 16
token_refresh_after_seconds: 20
stages:
  - users: 2
    spawn_rate: 1
    duration_seconds: 10
thresholds:
  - name: distributed p95 latency
    metric: p95_response_time_ms
    operator: lte
    threshold: 1000
  - name: distributed error rate
    metric: error_rate
    operator: lte
    threshold: 0.01
  - name: distributed request evidence
    metric: total_requests
    operator: gte
    threshold: 10
