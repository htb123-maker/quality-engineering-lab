name: SUT Integration

on:
  pull_request:
    paths:
      - ".github/workflows/sut-integration.yml"
      - ".env.example"
      - "apps/compose/**"
      - "packages/qa_core/config/settings.py"
      - "packages/qa_core/data_factories/**"
      - "packages/qa_core/db/**"
      - "packages/qa_core/resource_pools/**"
      - "scripts/check_sut.py"
      - "scripts/run_api_parallel.ps1"
      - "tests/api/**"
      - "tests/integration/**"
      - "tests/unit/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sut-integration.yml"
      - ".env.example"
      - "apps/compose/**"
      - "packages/qa_core/config/settings.py"
      - "packages/qa_core/data_factories/**"
      - "packages/qa_core/db/**"
      - "packages/qa_core/resource_pools/**"
      - "scripts/check_sut.py"
      - "scripts/run_api_parallel.ps1"
      - "tests/api/**"
      - "tests/integration/**"
      - "tests/unit/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-sut:
    name: Docker Compose SUT
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Validate Compose configuration
        run: docker compose -f apps/compose/compose.yaml config --quiet

      - name: Start SUT
        run: |
          docker compose -f apps/compose/compose.yaml up \
            --detach --wait --wait-timeout 120 --build

      - name: Check API, PostgreSQL, and Redis
        run: uv run --no-sync python scripts/check_sut.py --wait-seconds 120

      - name: Verify schema and seed through psql
        run: |
          docker compose -f apps/compose/compose.yaml exec -T postgres \
            psql -U qa -d qa -v ON_ERROR_STOP=1 \
            -f /opt/qa/verify_day05.sql

      - name: Run integration tests
        run: |
          mkdir -p artifacts/allure-results
          uv run --no-sync pytest tests/integration -q \
            --alluredir=artifacts/allure-results

      - name: Run API suite in parallel
        run: |
          uv run --no-sync pytest tests/api -q -n 4 \
            --basetemp=artifacts/pytest-tmp \
            --alluredir=artifacts/allure-results

      - name: Verify no test namespace was left behind
        run: uv run --no-sync python scripts/check_sut.py --wait-seconds 60

      - name: Capture Compose logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f apps/compose/compose.yaml logs --no-color \
            > artifacts/sut-compose.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sut-diagnostics
          path: |
            artifacts/
          if-no-files-found: ignore

      - name: Stop SUT
        if: always()
        run: docker compose -f apps/compose/compose.yaml down --volumes --remove-orphans
