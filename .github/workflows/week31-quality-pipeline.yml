name: Quality Pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - "study/week-*"
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
    - cron: "0 19 * * 0"

permissions:
  actions: read
  contents: read

env:
  PYTHONPATH: packages

jobs:
  quality:
    name: Quality gates and governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Mypy
        run: uv run --no-sync mypy packages tests performance ai
      - name: Unit tests
        run: |
          mkdir -p artifacts
          uv run --no-sync pytest tests/unit -q \
            --alluredir=artifacts/allure-quality \
            --junitxml=artifacts/quality-junit.xml
      - name: Governance
        run: uv run --no-sync python scripts/check_quality_governance.py
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week31-quality
          path: |
            artifacts/allure-quality/
            artifacts/quality-junit.xml
            artifacts/defect-drafts/
          if-no-files-found: ignore

  ai-eval:
    name: AI Golden Tasks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Run deterministic evidence triage eval
        run: |
          mkdir -p artifacts/ai/week32
          uv run --no-sync python -m ai.evals.run_golden_tasks \
            --tasks ai/golden_tasks/week32.jsonl \
            --review ai/evals/week32-human-review.json \
            --output artifacts/ai/week32/agent-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week32-ai-eval
          path: artifacts/ai/week32/
          if-no-files-found: ignore

  sut:
    name: Compose SUT and cross-layer tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Start SUT
        run: |
          docker compose -f apps/compose/compose.yaml \
            --profile fault-injection up \
            --detach --wait --wait-timeout 120 --build
      - name: Readiness
        run: uv run --no-sync python scripts/check_sut.py --wait-seconds 120
      - name: Integration tests
        run: |
          mkdir -p artifacts
          uv run --no-sync pytest tests/integration -q \
            --alluredir=artifacts/allure-sut \
            --junitxml=artifacts/sut-junit.xml
      - name: API tests
        run: |
          uv run --no-sync pytest tests/api -q -n 4 \
            --basetemp=artifacts/pytest-tmp \
            --alluredir=artifacts/allure-sut \
            --junitxml=artifacts/api-junit.xml
      - name: Compose logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f apps/compose/compose.yaml logs --no-color \
            > artifacts/sut-compose.log
      - name: Stop SUT
        if: always()
        run: |
          docker compose -f apps/compose/compose.yaml \
            --profile fault-injection down --volumes --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week31-sut
          path: artifacts/
          if-no-files-found: ignore

  android:
    name: Android Linux emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Install Appium
        run: |
          npm install --global appium@2.19.0
          appium driver install uiautomator2@4.2.9
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start business SUT and fault injection
        run: |
          docker compose -f apps/compose/compose.yaml \
            --profile fault-injection up \
            --detach --wait --wait-timeout 120 --build
      - name: Readiness for Android business E2E
        run: uv run --no-sync python scripts/check_sut.py --wait-seconds 120
      - name: Boot Android and run smoke
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_RUN_ANDROID_BUSINESS_E2E: "1"
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash scripts/run_android_linux_smoke.sh emulator-5554
      - name: Stop business SUT
        if: always()
        run: |
          docker compose -f apps/compose/compose.yaml \
            --profile fault-injection down --volumes --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week31-android
          path: artifacts/
          if-no-files-found: ignore

  ios-simulator:
    name: iOS macOS Simulator smoke
    runs-on: macos-15
    timeout-minutes: 60
    env:
      QA_IOS_DEVICE_PROVIDER: local
      QA_IOS_DEVICE_MATRIX: configs/ios-device-matrix.yaml
      QA_IOS_DEVICE_IDS: simulator-current-primary
      QA_IOS_RUN_ID: ${{ github.run_id }}
      QA_IOS_BUNDLE_ID: com.example.qaweek19
      QA_IOS_USE_NEW_WDA: "false"
      QA_IOS_SHOW_XCODE_LOG: "true"
      QA_IOS_WDA_LAUNCH_TIMEOUT_MS: "600000"
      QA_IOS_WDA_STARTUP_RETRIES: "1"
      QA_IOS_WDA_STARTUP_RETRY_INTERVAL_MS: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Select Xcode
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list runtimes
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Appium
        run: |
          npm install --global appium@2.19.0
          appium driver install xcuitest@8.4.3
      - name: Select and boot Simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list devices available -j > artifacts/ios-simulators.json
          python3 scripts/select_ios_simulator_matrix.py \
            --input artifacts/ios-simulators.json \
            --runtime-version "$SDK_VERSION" \
            --output-env artifacts/ios-simulator-matrix.env \
            --json
          cat artifacts/ios-simulator-matrix.env >> "$GITHUB_ENV"
          current_udid="$(
            sed -n 's/^QA_IOS_SIM_CURRENT_UDID=//p' \
              artifacts/ios-simulator-matrix.env
          )"
          test -n "$current_udid"
          xcrun simctl boot "$current_udid" || true
          open -a Simulator
          for attempt in {1..120}; do
            if xcrun simctl list devices |
              grep -F "$current_udid" |
              grep -q "(Booted)"; then
              exit 0
            fi
            if [[ "$attempt" -eq 120 ]]; then
              xcrun simctl list devices
              exit 1
            fi
            sleep 2
          done
      - name: Build and install fixture
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios-fixture/QaIosFixture.xcodeproj \
            -scheme QaIosFixture \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$QA_IOS_SIM_CURRENT_UDID" \
            -derivedDataPath artifacts/ios-fixture-simulator-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          app_path="artifacts/ios-fixture-simulator-derived/Build/Products/Debug-iphonesimulator/QaIosFixture.app"
          test -d "$app_path"
          xcrun simctl install "$QA_IOS_SIM_CURRENT_UDID" "$app_path"
      - name: Prebuild WebDriverAgent
        shell: bash
        run: |
          set -euo pipefail
          module_root="$HOME/.appium/node_modules/appium-xcuitest-driver/node_modules"
          test -d "$module_root/appium-webdriveragent/WebDriverAgent.xcodeproj"
          xcodebuild build-for-testing \
            -project "$module_root/appium-webdriveragent/WebDriverAgent.xcodeproj" \
            -scheme WebDriverAgentRunner \
            -derivedDataPath "$module_root" \
            -destination "id=$QA_IOS_SIM_CURRENT_UDID" \
            "IPHONEOS_DEPLOYMENT_TARGET=$QA_IOS_SIM_CURRENT_VERSION" \
            GCC_TREAT_WARNINGS_AS_ERRORS=0 \
            COMPILER_INDEX_STORE_ENABLE=NO
      - name: Start Appium
        shell: bash
        run: |
          set -euo pipefail
          nohup appium --address 127.0.0.1 --port 4723 --log-level debug \
            > artifacts/appium-ios-week31.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4723/status; then
              exit 0
            fi
            if [[ "$attempt" -eq 60 ]]; then
              cat artifacts/appium-ios-week31.log
              exit 1
            fi
            sleep 2
          done
      - name: Run iOS Simulator smoke
        run: |
          export QA_IOS_UDID="$QA_IOS_SIM_CURRENT_UDID"
          export QA_IOS_DEVICE_NAME="$QA_IOS_SIM_CURRENT_DEVICE"
          export QA_IOS_PLATFORM_VERSION="$QA_IOS_SIM_CURRENT_VERSION"
          uv run --no-sync pytest \
            tests/ios/test_session.py \
            tests/ios/test_screen_framework.py \
            tests/ios/test_week19_system_interactions.py::test_01_fixture_launches \
            tests/ios/test_week21_fixture_ui.py::test_fixture_title_is_visible \
            -q \
            --alluredir=artifacts/allure-ios-simulator \
            --junitxml=artifacts/ios-simulator-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week31-ios-simulator
          path: artifacts/
          if-no-files-found: ignore

  ios-cloud:
    name: iOS real-device cloud smoke (optional)
    if: ${{ vars.IOS_CLOUD_APP != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_IOS_DEVICE_PROVIDER: browserstack
      QA_IOS_CLOUD_REMOTE_URL: https://hub-cloud.browserstack.com/wd/hub
      QA_IOS_CLOUD_USER: ${{ secrets.IOS_CLOUD_USER }}
      QA_IOS_CLOUD_ACCESS_KEY: ${{ secrets.IOS_CLOUD_ACCESS_KEY }}
      QA_IOS_CLOUD_APP: ${{ vars.IOS_CLOUD_APP }}
      QA_IOS_CLOUD_DEVICE_NAME: iPhone 15
      QA_IOS_CLOUD_PLATFORM_VERSION: "17"
      QA_IOS_CLOUD_PROJECT_NAME: quality-engineering-lab
      QA_IOS_CLOUD_BUILD_NAME: week31-ios-${{ github.run_id }}
      QA_IOS_CLOUD_SESSION_NAME: week31-ios-smoke
      QA_IOS_CLOUD_APPIUM_VERSION: "2.19.0"
      QA_IOS_BUNDLE_ID: com.example.qaweek19
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Run cloud smoke and launch evidence
        run: |
          mkdir -p artifacts
          set +e
          uv run --no-sync pytest \
            tests/ios/test_cloud_session.py \
            tests/ios/test_week30_cloud_performance.py \
            -q \
            --alluredir=artifacts/allure-ios \
            --junitxml=artifacts/ios-junit.xml 2>&1 | tee artifacts/ios-tests.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -eq 0 ]]; then
            printf '%s\n' 'BrowserStack iOS cloud smoke passed.' \
              > artifacts/ios-cloud-pass.txt
            exit 0
          fi
          if grep -q "App Automate testing time has expired" artifacts/ios-tests.log; then
            printf '%s\n' \
              'BLOCKED: BrowserStack App Automate trial time expired' \
              > artifacts/ios-cloud-blocked.txt
            mv artifacts/ios-junit.xml artifacts/ios-blocked-junit.xml.disabled || true
            exit 0
          fi
          printf '%s\n' 'FAILED: see ios-tests.log' > artifacts/ios-cloud-failed.txt
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week31-ios-cloud-optional
          path: artifacts/
          if-no-files-found: ignore

  performance:
    name: Performance smoke and trend input
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Start isolated performance SUT
        run: |
          docker compose -p quality-engineering-lab-performance \
            --env-file .env.performance.example \
            -f apps/compose/compose.yaml up \
            --detach --wait --wait-timeout 120 --build
      - name: Run performance smoke
        run: |
          uv run --no-sync python scripts/run_performance_profile.py \
            --profile configs/performance-smoke.yaml \
            --label smoke \
            --output-dir artifacts/performance/week31 \
            --warmup-seconds 5 \
            --measured-runs 1
      - name: Stop performance SUT
        if: always()
        run: |
          docker compose -p quality-engineering-lab-performance \
            --env-file .env.performance.example \
            -f apps/compose/compose.yaml down --volumes --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week31-performance
          path: artifacts/performance/week31/
          if-no-files-found: ignore

  trends:
    name: Quality trend and evidence index
    needs:
      - quality
      - ai-eval
      - sut
      - android
      - ios-simulator
      - ios-cloud
      - performance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/collected
          merge-multiple: true
      - name: Record required job failures
        if: always()
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          AI_EVAL_RESULT: ${{ needs.ai-eval.result }}
          SUT_RESULT: ${{ needs.sut.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_SIMULATOR_RESULT: ${{ needs.ios-simulator.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
        run: |
          mkdir -p artifacts/collected/required-jobs
          for entry in \
            "quality:$QUALITY_RESULT" \
            "ai-eval:$AI_EVAL_RESULT" \
            "sut:$SUT_RESULT" \
            "android:$ANDROID_RESULT" \
            "ios-simulator:$IOS_SIMULATOR_RESULT" \
            "performance:$PERFORMANCE_RESULT"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            if [ "$result" != "success" ]; then
              printf '{"status":"FAILED","job":"%s","result":"%s"}\n' \
                "$name" "$result" \
                > "artifacts/collected/required-jobs/${name}.json"
            fi
          done
      - uses: actions/cache/restore@v4
        with:
          path: artifacts/quality-history
          key: quality-trends-v1-${{ github.run_id }}
          restore-keys: |
            quality-trends-v1-
      - name: Build trends
        run: |
          uv run --no-sync python scripts/build_quality_trends.py \
            --artifacts-root artifacts/collected \
            --history artifacts/quality-history/history.json \
            --run-id "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --json-output artifacts/quality-history/history.json \
            --html-output artifacts/quality-trends/index.html \
            --fail-on-incomplete
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: artifacts/quality-history
          key: quality-trends-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week31-trends
          path: |
            artifacts/quality-history/
            artifacts/quality-trends/
          if-no-files-found: ignore
