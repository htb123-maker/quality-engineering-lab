name: iOS Week 21 Cloud Smoke

on:
  push:
    paths:
      - .github/workflows/ios-week21-cloud.yml
      - tests/ios/test_cloud_session.py
  workflow_dispatch:
    inputs:
      device_name:
        description: BrowserStack real-device name
        required: true
        default: iPhone 15
        type: string
      platform_version:
        description: iOS version
        required: true
        default: "17"
        type: string

permissions:
  contents: read

jobs:
  ios-week21-cloud:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      QA_IOS_DEVICE_PROVIDER: browserstack
      QA_IOS_DEVICE_IDS: cloud-iphone
      QA_IOS_DEVICE_MATRIX: configs/ios-device-matrix.yaml
      QA_IOS_RUN_ID: ${{ github.run_id }}
      QA_IOS_CLOUD_REMOTE_URL: https://hub-cloud.browserstack.com/wd/hub
      QA_IOS_CLOUD_USER: ${{ secrets.IOS_CLOUD_USER }}
      QA_IOS_CLOUD_ACCESS_KEY: ${{ secrets.IOS_CLOUD_ACCESS_KEY }}
      QA_IOS_CLOUD_DEVICE_NAME: ${{ inputs.device_name }}
      QA_IOS_CLOUD_PLATFORM_VERSION: ${{ inputs.platform_version }}
      QA_IOS_CLOUD_PROJECT_NAME: quality-engineering-lab
      QA_IOS_CLOUD_BUILD_NAME: week21-cloud-${{ github.run_id }}
      QA_IOS_CLOUD_SESSION_NAME: week21-cloud-smoke
      QA_IOS_CLOUD_APPIUM_VERSION: "2.19.0"
      QA_IOS_BUNDLE_ID: com.example.qaweek19

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Build signed-free iOS fixture IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios-fixture/QaIosFixture.xcodeproj \
            -scheme QaIosFixture \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath artifacts/ios-fixture-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package fixture IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="artifacts/ios-fixture-derived/Build/Products/Debug-iphoneos/QaIosFixture.app"
          test -d "$app_path"
          mkdir -p artifacts/ios-fixture-ipa/Payload
          cp -R "$app_path" artifacts/ios-fixture-ipa/Payload/
          cd artifacts/ios-fixture-ipa
          zip -qry ../QaIosFixture.ipa Payload
          test -s ../QaIosFixture.ipa

      - name: Upload fixture to BrowserStack
        shell: bash
        run: |
          set -euo pipefail
          test -n "${QA_IOS_CLOUD_USER:-}"
          test -n "${QA_IOS_CLOUD_ACCESS_KEY:-}"
          curl --fail --silent --show-error \
            -u "$QA_IOS_CLOUD_USER:$QA_IOS_CLOUD_ACCESS_KEY" \
            -X POST \
            -F "file=@artifacts/QaIosFixture.ipa" \
            https://api-cloud.browserstack.com/app-automate/upload \
            > artifacts/browserstack-upload.json
          app_url="$(
            python3 -c \
              'import json; print(json.load(open("artifacts/browserstack-upload.json"))["app_url"])'
          )"
          test -n "$app_url"
          echo "QA_IOS_CLOUD_APP=$app_url" >> "$GITHUB_ENV"

      - name: Validate inventory before cloud execution
        run: uv run --no-sync python scripts/check_ios_test_inventory.py

      - name: Run Week 21 cloud smoke
        run: |
          mkdir -p artifacts/allure-week21-cloud
          uv run --no-sync pytest tests/ios/test_cloud_session.py -q \
            --alluredir=artifacts/allure-week21-cloud \
            --junitxml=artifacts/week21-cloud-junit.xml

      - name: Upload Week 21 cloud evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-week21-cloud-evidence
          path: |
            artifacts/allure-week21-cloud/
            artifacts/browserstack-upload.json
            artifacts/week21-cloud-junit.xml
          if-no-files-found: ignore
