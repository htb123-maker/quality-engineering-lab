name: quality-engineering-lab

services:
  api:
    image: quality-engineering-lab/sut-api:local
    build:
      context: ../..
      dockerfile: apps/compose/api/Dockerfile
    environment:
      QA_ENVIRONMENT: ${QA_ENVIRONMENT:-local}
      QA_POSTGRES_DSN: postgresql://${QA_POSTGRES_USER:-qa}:${QA_POSTGRES_PASSWORD:-qa}@postgres:5432/${QA_POSTGRES_DB:-qa}
      QA_POSTGRES_MAX_CONNECTIONS: ${QA_POSTGRES_MAX_CONNECTIONS:-16}
      QA_POSTGRES_CONNECTION_TIMEOUT_SECONDS: ${QA_POSTGRES_CONNECTION_TIMEOUT_SECONDS:-2}
      QA_REDIS_URL: redis://redis:6379/0
      QA_LOG_LEVEL: ${QA_LOG_LEVEL:-INFO}
      QA_AUTH_TEST_PASSWORD: ${QA_AUTH_TEST_PASSWORD:-local-test-password}
      QA_AUTH_JWT_SECRET: ${QA_AUTH_JWT_SECRET:-local-sut-jwt-secret-not-for-production}
      QA_AUTH_ACCESS_TOKEN_TTL_SECONDS: ${QA_AUTH_ACCESS_TOKEN_TTL_SECONDS:-300}
      QA_AUTH_REFRESH_TOKEN_TTL_SECONDS: ${QA_AUTH_REFRESH_TOKEN_TTL_SECONDS:-3600}
      QA_IDEMPOTENCY_TTL_SECONDS: ${QA_IDEMPOTENCY_TTL_SECONDS:-3600}
      QA_RATE_LIMIT_WRITE_MAX: ${QA_RATE_LIMIT_WRITE_MAX:-20}
      QA_RATE_LIMIT_WRITE_WINDOW_SECONDS: ${QA_RATE_LIMIT_WRITE_WINDOW_SECONDS:-60}
      QA_RATE_LIMIT_PRINCIPAL_MAX: ${QA_RATE_LIMIT_PRINCIPAL_MAX:-40}
      QA_AUTH_SIGNIN_FAILURE_MAX: ${QA_AUTH_SIGNIN_FAILURE_MAX:-10}
      QA_AUTH_SIGNIN_FAILURE_WINDOW_SECONDS: ${QA_AUTH_SIGNIN_FAILURE_WINDOW_SECONDS:-60}
      QA_MAX_REQUEST_BYTES: ${QA_MAX_REQUEST_BYTES:-65536}
      QA_CATALOG_CACHE_TTL_SECONDS: ${QA_CATALOG_CACHE_TTL_SECONDS:-60}
      QA_CATALOG_CACHE_NEGATIVE_TTL_SECONDS: ${QA_CATALOG_CACHE_NEGATIVE_TTL_SECONDS:-10}
      QA_CACHE_STATS_TTL_SECONDS: ${QA_CACHE_STATS_TTL_SECONDS:-3600}
      QA_JOB_TTL_SECONDS: ${QA_JOB_TTL_SECONDS:-900}
      QA_JOB_WORKER_ENABLED: ${QA_JOB_WORKER_ENABLED:-1}
      QA_JOB_WORKER_POLL_SECONDS: ${QA_JOB_WORKER_POLL_SECONDS:-0.25}
      QA_WS_SUBSCRIBER_QUEUE_SIZE: ${QA_WS_SUBSCRIBER_QUEUE_SIZE:-64}
      QA_WS_POLL_SECONDS: ${QA_WS_POLL_SECONDS:-0.2}
      QA_OTEL_ENABLED: ${QA_OTEL_ENABLED:-0}
      QA_OTEL_SERVICE_NAME: ${QA_OTEL_SERVICE_NAME:-quality-engineering-lab-sut}
      QA_OTEL_EXPORTER_OTLP_ENDPOINT: ${QA_OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
    ports:
      - "${QA_API_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    init: true
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${QA_POSTGRES_DB:-qa}
      POSTGRES_USER: ${QA_POSTGRES_USER:-qa}
      POSTGRES_PASSWORD: ${QA_POSTGRES_PASSWORD:-qa}
    ports:
      - "${QA_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/verify_day05.sql:/opt/qa/verify_day05.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${QA_POSTGRES_USER:-qa} -d ${QA_POSTGRES_DB:-qa}
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "${QA_REDIS_PORT:-26379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    profiles:
      - fault-injection
    ports:
      - "${QA_TOXIPROXY_CONTROL_PORT:-18474}:8474"
      - "18100-18103:18100-18103"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles:
      - monitoring
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${QA_PROMETHEUS_PORT:-29090}:9090"
    volumes:
      - ../../infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    profiles:
      - monitoring
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "${QA_GRAFANA_PORT:-23000}:3000"
    volumes:
      - ../../infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    profiles:
      - monitoring
    command:
      - -config.file=/etc/tempo/tempo.yaml
    ports:
      - "${QA_TEMPO_HTTP_PORT:-23200}:3200"
      - "${QA_TEMPO_OTLP_HTTP_PORT:-24318}:4318"
    volumes:
      - ../../infra/monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    profiles:
      - monitoring
    environment:
      DATA_SOURCE_NAME: postgresql://${QA_POSTGRES_USER:-qa}:${QA_POSTGRES_PASSWORD:-qa}@postgres:5432/${QA_POSTGRES_DB:-qa}?sslmode=disable
    ports:
      - "${QA_POSTGRES_EXPORTER_PORT:-29187}:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    profiles:
      - monitoring
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "${QA_REDIS_EXPORTER_PORT:-29121}:9121"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles:
      - monitoring
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
    ports:
      - "${QA_CADVISOR_PORT:-28081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  tempo-data:
